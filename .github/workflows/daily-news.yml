# GitHub Actions - 孟加拉每日新闻摘要
# 每天 UTC 02:00 (= BDT 08:00) 自动运行
# 需要在仓库 Settings → Secrets and variables → Actions 中配置：
#   AGENTMAIL_API_KEY  = am_us_xxxxxxxx...

name: Daily Bangladesh News Digest

on:
  schedule:
    # UTC 02:00 = BDT 08:00
    - cron: '0 2 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch & send Bangladesh news
        uses: ./
        with:
          agentmail-api-key: ${{ secrets.AGENTMAIL_API_KEY }}
          agentmail-email: shidp@agentmail.to
          recipient-email: shidp304@gmail.com
