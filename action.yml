# action.yml — GitHub Action 入口配置
name: "Bangladesh Daily News Digest"
description: >
  每天自动抓取孟加拉 The Daily Star 头条新闻，
  使用 AI 提取摘要后通过 AgentMail 发送邮件。
  通过 AgentMail API 发送邮件，无需 Gmail App Password。
branding:
  icon: "rss"
  color: "green"
author: "南海 (shidp)"

inputs:
  agentmail-api-key:
    description: "AgentMail API Key (以 am_ 开头)"
    required: true
    default: ""
  agentmail-email:
    description: "AgentMail 发件邮箱"
    required: false
    default: "shidp@agentmail.to"
  recipient-email:
    description: "收件人邮箱"
    required: false
    default: "shidp304@gmail.com"
  news-count:
    description: "每天发送的新闻数量"
    required: false
    default: "12"
  subject-prefix:
    description: "邮件标题前缀"
    required: false
    default: "🇧🇩 孟加拉每日新闻摘要"
  top-source:
    description: "优先关键词列表，逗号分隔"
    required: false
    default: "government,politics,election,sheikh hasina,bangladesh bank,imf,world bank,adb"
  exclude-keywords:
    description: "排除关键词列表，逗号分隔"
    required: false
    default: "sports,cricket,football,entertainment,movie,celebrity"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      shell: bash
      run: pip install requests beautifulsoup4 lxml --quiet

    - name: Run news digest
      shell: bash
      env:
        AGENTMAIL_API_KEY: ${{ inputs.agentmail-api-key }}
        AGENTMAIL_EMAIL: ${{ inputs.agentmail-email }}
        RECIPIENT_EMAIL: ${{ inputs.recipient-email }}
        NEWS_COUNT: ${{ inputs.news-count }}
        SUBJECT_PREFIX: ${{ inputs.subject-prefix }}
        TOP_SOURCE: ${{ inputs.top-source }}
        EXCLUDE_KEYWORDS: ${{ inputs.exclude-keywords }}
      run: |
        chmod +x "$GITHUB_ACTION_PATH/entrypoint.sh"
        "$GITHUB_ACTION_PATH/entrypoint.sh"

    - name: Report status
      if: always()
      shell: bash
      run: echo "✅ News digest completed at $(date)"
